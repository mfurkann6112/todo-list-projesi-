<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List...</title>

    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .card {
            border: none;
            border-radius: 1rem;
        }
        .list-group-item {
            border-radius: 0.5rem !important;
            margin-bottom: 0.5rem;
            border: 1px solid #eef0f3;
            transition: all 0.2s ease;
        }
        .list-group-item:hover {
            background-color: #f8fafc;
            transform: translateY(-1px);
        }
        .delete-item {
            color: #dc3545;
            transition: color 0.2s;
        }
        .delete-item:hover {
            color: #a71d2a;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm">
                    <!-- Başlık Bölümü -->
                    <div class="card-header bg-white border-bottom-0 pt-4 px-4 pb-0">
                        <div class="d-flex align-items-center justify-content-between">
                            <h4 class="card-title fw-bold text-dark mb-0">
                                <i class="fa-solid fa-list-check text-primary me-2"></i>Todo List
                            </h4>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2">Proje</span>
                        </div>
                    </div>

                    <div class="card-body px-4 pt-4">
                        <!-- Todo Ekleme Formu -->
                        <form id="todoAddForm" class="mb-4">
                            <label for="todoName" class="form-label text-secondary small fw-medium">Yeni Görev</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="fa-solid fa-plus"></i>
                                </span>
                                <input type="text" class="form-control bg-light border-start-0 ps-0 shadow-none" 
                                       id="todoName" placeholder="Ne yapılması gerekiyor?" autocomplete="off">
                                <button id="todoAddButton" type="submit" class="btn btn-primary px-3 fw-medium">
                                    Ekle
                                </button>
                            </div>
                        </form>

                        <hr class="text-black-50 my-4 opacity-25">

                        <!-- Todo Arama Formu -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="text-secondary fw-semibold mb-0 small text-uppercase tracking-wide">Görevler</h6>
                            </div>
                            <form name="form2" id="todoListForm">
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                    </span>
                                    <input id="todoSearch" type="text" class="form-control bg-light border-start-0 ps-0 shadow-none" 
                                           placeholder="Görevlerde ara...">
                                </div>
                            </form>
                        </div>

                        <!-- Todo Listesi -->
                        <ul class="list-group list-group-flush mb-4">
                            <!--
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3 shadow-none">
                                <span class="text-dark">Örnek Görev 1</span>
                                <a href="#" class="delete-item text-decoration-none">
                                    <i class="fa-solid fa-trash-can"></i>
                                </a>
                            </li>
                            -->
                        </ul>

                        <!-- Temizleme Butonu -->
                        <div class="d-grid">
                            <a href="#" id="clearButton" class="btn btn-outline-danger btn-sm py-2 fw-medium">
                                <i class="fa-regular fa-trash-can me-1"></i> Tüm Todoları Temizle
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS (Popper içerir, jQuery gereksinimi kaldırıldı) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Kendi JS dosyanız -->
    <script src="todoEpOrnek.js"></script>
</body>

</html>
